<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>표준단어 관리 시스템</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/std_word_list.css}">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo-area">
            <div class="logo-icon">DB</div>
            <span>표준단어 관리 시스템</span>
        </div>
        <div class="user-area">
            <button class="icon-btn">🔔</button>
            <button class="icon-btn">🌙</button>
            <div class="avatar"></div>
        </div>
    </header>

    <div class="container">
        <!-- Sidebar -->
        <aside>
            <a th:href="@{/std-dashboard}" class="menu-item">대시보드</a>
            <a href="#" class="menu-item active">표준단어 검색</a>
            <a th:href="@{/std-word/insert}" class="menu-item">표준 단어 등록</a>
            <a href="#" class="menu-item">관리자 설정</a>
        </aside>

        <!-- Main Content -->
        <main>
            <!-- Search Form -->
            <form th:action="@{/std-word/list}" method="get" th:object="${searchDto}" class="search-box" id="searchForm"
                onsubmit="handleSearchSubmit(event)">
                <input type="hidden" name="size" th:value="*{size}">

                <div class="search-input-wrapper">
                    <input type="text" th:field="*{stdWordName}" class="search-input" placeholder="단어 검색">
                    <button type="submit" class="search-btn">🔍</button>
                </div>
                <a th:href="@{/std-word/list}" class="reset-btn">초기화</a>
            </form>

            <!-- Footer Actions (Moved) -->
            <div class="footer-actions" style="margin-top: 0; margin-bottom: 20px;">
                <div class="selected-word-title">선택 표준단어</div>
                <div class="input-group">
                    <!-- 선택된 단어들이 표시될 입력창들입니다. -->
                    <input type="text" name="text1" class="footer-input" readonly>
                    <input type="text" name="text2" class="footer-input" readonly>
                    <input type="text" name="text3" class="footer-input" readonly>
                    <input type="text" name="text4" class="footer-input" readonly>
                    <button class="action-btn">약어명 조합 결과</button>
                    <button class="action-btn">단어명 조합 결과</button>
                </div>
            </div>

            <!-- Data Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>번호</th>
                            <th>표준 단어</th>
                            <th>영문 약어명</th>
                            <th>영문명</th>
                            <th>설명</th>
                            <th>도메인 분류명</th>
                            <th>사용여부</th>
                            <th>선택</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(list)}">
                            <td colspan="8" style="text-align: center; padding: 40px;">데이터가 없습니다.</td>
                        </tr>
                        <tr th:each="word, stat : ${list}">
                            <td th:text="${word.wordId}">1</td>
                            <td th:text="${word.stdWordName}">ABL생명</td>
                            <td th:text="${word.engAbbrName}">ABL_LIFE</td>
                            <td th:text="${word.engFullName}">ABL Life Insurance</td>
                            <td th:text="${word.definition}">설명...</td>
                            <td th:text="${word.domainType}">공통</td>
                            <td th:text="${word.useYn}">Y</td>
                            <td>
                                <input type="checkbox" class="select-checkbox" th:value="${word.stdWordName}"
                                    onclick="handleSelection(this)">
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Page Size Selector -->
            <div
                style="display: flex; justify-content: center; margin-top: 20px; margin-bottom: 20px; gap: 10px; align-items: center;">
                <span>페이지 당 개수:</span>
                <select id="pageSizeSelect" style="padding: 5px; border-radius: 4px; border: 1px solid #ddd;"
                    onchange="changePageSize(this.value)">
                    <option value="10" th:selected="${searchDto.size == 10}">10개</option>
                    <option value="50" th:selected="${searchDto.size == 50}">50개</option>
                    <option value="100" th:selected="${searchDto.size == 100}">100개</option>
                    <option value="300" th:selected="${searchDto.size == 300}">300개</option>
                    <option value="500" th:selected="${searchDto.size == 500}">500개</option>
                </select>
            </div>
    </div>



    <!-- Iframe Modal -->
    <div id="updateModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="closeUpdateModal()">×</button>
            <iframe id="updateFrame" src="" frameborder="0"></iframe>
        </div>
    </div>

    <script th:src="@{/js/std_word_list.js}"></script>
    </main>
    </div>

</body>

</html>
