<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>GA마케팅 자료 사이트</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Material Icons for eye toggle -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</head>

<body>

    <div class="login-container">
        <!-- Left Branding Section -->
        <div class="login-image-section">
            <div class="branding-text">
                로그인해서 서비스를<br>이용하세요
            </div>
            <div class="art-image-wrapper">
                <img th:src="@{/images/login_logo.png}" alt="Login Art" class="art-image">
            </div>
        </div>

        <!-- Right Form Section -->
        <div class="login-form-section">
            <h2 class="form-title">로그인</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label for="userId" class="form-label">아이디 :</label>
                    <input type="text" id="userId" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">비밀번호</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-control" required>
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="비밀번호 표시/숨기기">
                            <span class="material-icons-outlined">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="options-row">
                    <div class="checkbox-group">
                        <input type="checkbox" id="rememberLogin">
                        <label for="rememberLogin">로그인 상태 유지</label>
                    </div>
                    <a href="#" class="forgot-password">비밀번호 찾기</a>
                </div>

                <button type="submit" class="login-btn">로그인</button>

                <div class="signup-link">
                    아직 통합회원이 아니신가요? <a href="/member">회원가입</a>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/login2.js}"></script>
</body>

</html>
