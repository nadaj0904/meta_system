<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GA마케팅 자료 사이트 | 로그인</title>
    <!-- New Vibe Responsive CSS -->
    <link rel="stylesheet" th:href="@{/css/login2.css}">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Material Icons for eye toggle -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</head>

<body>

    <div id="vibe-login-root">
        <!-- Left Branding Section (Visible on Desktop) -->
        <div class="login-image-section">
            <div class="branding-text">
                로그인해서 서비스를<br>더 편리하게 이용하세요
            </div>
            <div class="art-image-wrapper">
                <img th:src="@{/images/login_logo.png}" alt="Login Art" class="art-image">
            </div>
        </div>

        <!-- Right Form Section -->
        <div class="vibe-form-body">
            <div class="header-group">
                <h2 class="form-title">로그인</h2>
                <p class="form-subtitle">서비스 이용을 위해 정보를 입력해주세요</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="userId" class="form-label">아이디</label>
                    <div class="input-container">
                        <input type="text" id="userId" class="form-control" placeholder="아이디를 입력하세요" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">비밀번호</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="비밀번호를 입력하세요" required>
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="비밀번호 표시/숨기기">
                            <span class="material-icons-outlined">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="options-row">
                    <div class="checkbox-group">
                        <input type="checkbox" id="rememberLogin">
                        <label for="rememberLogin">로그인 상태 유지</label>
                    </div>
                    <a href="#" class="forgot-password">비밀번호 찾기</a>
                </div>

                <button type="submit" class="login-btn">로그인</button>

                <div class="signup-link">
                    아직 회원이 아니신가요? <a href="/member">회원가입</a>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/login2.js}"></script>
</body>

</html>
