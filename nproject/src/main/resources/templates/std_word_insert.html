<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>표준단어 등록 - 표준단어 관리 시스템</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/std_word_insert.css}">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo-area">
            <div class="logo-icon">DB</div>
            <span>표준단어 관리 시스템</span>
        </div>
        <div class="user-area">
            <button class="icon-btn">🔔</button>
            <button class="icon-btn">🌙</button>
            <div class="avatar"></div>
        </div>
    </header>

    <div class="container">
        <!-- Sidebar -->
        <aside>
            <a href="#" class="menu-item">대시보드</a>
            <a th:href="@{/std-word/list}" class="menu-item">표준단어 검색</a>
            <a th:href="@{/std-word/insert}" class="menu-item active">표준 단어 등록</a>
            <a href="#" class="menu-item">관리자 설정</a>
        </aside>

        <!-- Main Content -->
        <main>
            <div class="page-header">
                <h2 class="page-title">표준단어 등록</h2>
            </div>

            <!-- Registration Form -->
            <div class="form-container">
                <form th:action="@{/std-word/insert}" th:object="${stdWordDto}" method="post" id="insertForm"
                    onsubmit="handleInsertFormSubmit(event)">

                    <div class="form-group">
                        <label class="form-label required">표준 단어명</label>
                        <div class="form-control-wrapper">
                            <input type="text" th:field="*{stdWordName}" class="form-control"
                                placeholder="표준 단어명을 입력하세요" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label required">영문 약어명</label>
                        <div class="form-control-wrapper">
                            <input type="text" th:field="*{engAbbrName}" class="form-control"
                                placeholder="영문 약어명을 입력하세요 (예: ST_WORD)" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">영문명</label>
                        <div class="form-control-wrapper">
                            <input type="text" th:field="*{engFullName}" class="form-control"
                                placeholder="영문 전체 이름을 입력하세요">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">도메인 분류명</label>
                        <div class="form-control-wrapper">
                            <input type="text" th:field="*{domainType}" class="form-control"
                                placeholder="도메인 분류를 입력하세요">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">설명</label>
                        <div class="form-control-wrapper">
                            <textarea th:field="*{definition}" class="form-control"
                                placeholder="단어에 대한 설명을 입력하세요"></textarea>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">동의어</label>
                        <div class="form-control-wrapper">
                            <input type="text" th:field="*{synonyms}" class="form-control"
                                placeholder="동의어를 쉼표(,)로 구분하여 입력하세요">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">금칙어</label>
                        <div class="form-control-wrapper">
                            <input type="text" th:field="*{forbiddenWords}" class="form-control"
                                placeholder="사용 금지된 단어를 입력하세요">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">표준여부</label>
                        <div class="form-control-wrapper">
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" th:field="*{coherenceYn}" value="Y" checked> 표준
                                </label>
                                <label class="radio-label">
                                    <input type="radio" th:field="*{coherenceYn}" value="N"> 비표준
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">사용여부</label>
                        <div class="form-control-wrapper">
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" th:field="*{useYn}" value="Y" checked> 사용
                                </label>
                                <label class="radio-label">
                                    <input type="radio" th:field="*{useYn}" value="N"> 미사용
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="btn-area">
                        <a th:href="@{/std-word/list}" class="btn btn-secondary" onclick="return handleCancel(event)">취소
                            / 목록</a>
                        <button type="submit" class="btn btn-primary">저장</button>
                    </div>

                </form>
            </div>

        </main>
    </div>

    <script th:src="@{/js/std_word_insert.js}"></script>

</body>

</html>
